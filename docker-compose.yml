services:
  huobao-drama:
    build: .
    ports:
      - "5679:5679"
    volumes:
      - ./data:/app/data
      - ./backend/workspace:/app/backend/workspace
    environment:
      - NODE_ENV=production
      - PORT=5679
      - MONGODB_AI_URI=${MONGODB_AI_URI}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5679/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    restart: unless-stopped
